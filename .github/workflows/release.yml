name: rust release action

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # BUILD-1: build.rs writes completions/man to OUT_DIR only; stage share/
      # into the repo root so the release action's files_to_pack can pick it
      # up (it only accepts paths relative to the repo root).
      - name: stage share/ from build script OUT_DIR
        shell: bash
        run: |
          cargo build
          # find -path matches both cargo build-script layouts: stable
          # "zdu-rs-<hash>/out" and nightly "zdu-rs/<hash>/out"; a glob on the
          # bare package name only matches the latter.
          src="$(find target/debug/build -type d -name share -path '*/out/share' | head -n1)"
          test -n "$src"
          cp -r "$src" share
      - name: release rust project
        uses: lxl66566/rust-simple-release@main
        with:
          targets: |
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            aarch64-pc-windows-msvc
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-musl
            x86_64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-apple-darwin
          files_to_pack: README.md, LICENSE-MIT, LICENSE-APACHE, share
