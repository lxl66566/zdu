[package]
name         = "zdu"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "A more intuitive version of du (port of du-dust)"
readme       = "README.md"
homepage     = "https://github.com/lxl66566/zdu"
repository   = "https://github.com/lxl66566/zdu"
license      = "MIT OR Apache-2.0"
keywords     = ["du", "command-line", "disk", "disk-usage"]
categories   = ["command-line-utilities"]
include      = [
  "/CHANGELOG.md",
  "/LICENSE-*",
  "/README.md",
  "/benches/**",
  "/build.rs",
  "/src/**",
  "/tests/**",
]

[[bin]]
name = "zdu"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto           = true
strip         = true

[dependencies]
clap          = { version = "4", features = ["derive"] }
lscolors      = "0.21"
nu-ansi-term  = "0.50"
terminal_size = "0.4"
unicode-width = "0.2"
rayon         = "1"
thousands     = "0.2"
stfu8         = "0.2"
regex         = "1"
config-file   = "0.2"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
ctrlc         = "3"
chrono        = "0.4"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.4"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
filesize    = "0.2.0"

[dev-dependencies]
assert_cmd = "2"
tempfile   = "=3"

[build-dependencies]
clap          = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
clap_mangen   = "0.3"

[[test]]
name = "integration"
path = "tests/tests.rs"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"
